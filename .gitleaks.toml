title = "flop-agent secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Public did:key fixtures under tests are identifiers, not secrets"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/(?:.*/)?[^/]+_test\.ts$''']
regexTarget = "match"
regexes = [
  '''^key:z6Mkv1o2GEgtXjFdEMfLtupcKhGRydM8V7VHzii7Uh4aHoqH"?$''',
  '''^key:z6MkwfNUQw8XipdgYceYRaiQxRue5k61sxHeZdQuLYQJH1Wj"?$''',
]
